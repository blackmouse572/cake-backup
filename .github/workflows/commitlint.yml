name: Commit messages

# Pull requests are squash-merged, so the PR title becomes the commit on
# main. This checks the title against the same Conventional Commits rules
# that the commit-msg hook applies to every local commit.
# Separate from CI so it also runs on docs-only pull requests.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

# Read-only token: no job here writes to the repo, and a step that runs
# repo code (install, build, tests) can't push or tag with it.
permissions:
  contents: read

jobs:
  pr-title:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
        env:
          LEFTHOOK: "0"
      - name: Check the pull request title
        env:
          # Passed through the environment, never interpolated into the script.
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | bunx commitlint --verbose
